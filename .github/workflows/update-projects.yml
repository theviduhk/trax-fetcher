name: Run Script Every Minute

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4   # ✅ update

      - name: Setup Node
        uses: actions/setup-node@v4  # ✅ update
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Run script
        run: node index.js
        env:
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
