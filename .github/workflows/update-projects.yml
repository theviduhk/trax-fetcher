name: Firebase Updater (Every Minute)

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔐 Create Firebase Key File
        run: |
          echo "${{ secrets.FIREBASE_KEY }}" > firebase-key.json

      - name: ▶️ Run script
        run: node index.js
        env:
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
