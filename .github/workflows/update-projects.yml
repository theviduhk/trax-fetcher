name: Run Firebase Updater Every Minute

on:
  schedule:
    - cron: "* * * * *"   # every 1 minute
  workflow_dispatch:       # manual run button

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔐 Create Firebase Key File
        run: |
          echo '${{ secrets.FIREBASE_KEY }}' > firebase-key.json

      - name: ▶️ Run script
        run: node index.js
